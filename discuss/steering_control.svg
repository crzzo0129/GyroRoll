<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Mini Wheelbot 偏航控制的离线训练与在线运行流程</title>
  <desc id="desc">上行是离线：实验数据、参数辨识、非线性动力学模型、非线性 MPC 专家、状态动作数据、神经网络训练。下行是在线：用户的朝向与速度指令、传感器状态估计、神经网络控制器、两台电机力矩、机器人与反馈。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f2b"/><stop offset="1" stop-color="#0a121b"/></linearGradient>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#82e8dd" stroke-width="1.7"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#ffc18c" stroke-width="1.7"/></marker>
    <style>text{font-family:system-ui,'Noto Sans SC',sans-serif}.label{fill:#a9bdc4;font-size:14px}.main{fill:#eff9f8;font-size:16px;font-weight:700}.sub{fill:#a9bdc4;font-size:12px}</style>
  </defs>
  <rect width="1200" height="540" rx="20" fill="url(#bg)"/>
  <text x="30" y="46" fill="#ffc18c" font-family="system-ui,'Noto Sans SC',sans-serif" font-weight="700" font-size="21">离线：先求出复杂问题的“老师”</text>
  <path d="M30 270H1170" stroke="#34505c" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="30" y="308" fill="#82e8dd" font-family="system-ui,'Noto Sans SC',sans-serif" font-weight="700" font-size="21">在线：把学到的策略放在机器人上运行</text>
  <!-- offline -->
  <g>
    <rect x="30" y="96" width="181" height="116" rx="13" fill="#2e2a26" stroke="#8b674f" stroke-width="2"/>
    <text x="50" y="134" class="main">真实实验轨迹</text><text x="50" y="164" class="sub">状态、轮力矩、偏航</text>
    <path d="M211 154H249" stroke="#ffc18c" stroke-width="3" marker-end="url(#ao)"/>
    <rect x="258" y="96" width="183" height="116" rx="13" fill="#2e2a26" stroke="#8b674f" stroke-width="2"/>
    <text x="278" y="134" class="main">参数辨识</text><text x="278" y="164" class="sub">质量、惯量、摩擦等</text>
    <path d="M441 154H479" stroke="#ffc18c" stroke-width="3" marker-end="url(#ao)"/>
    <rect x="488" y="96" width="183" height="116" rx="13" fill="#2e2a26" stroke="#8b674f" stroke-width="2"/>
    <text x="508" y="134" class="main">非线性模型</text><text x="508" y="164" class="sub">预测姿态与轮运动</text>
    <path d="M671 154H709" stroke="#ffc18c" stroke-width="3" marker-end="url(#ao)"/>
    <rect x="718" y="96" width="183" height="116" rx="13" fill="#2e2a26" stroke="#8b674f" stroke-width="2"/>
    <text x="738" y="134" class="main">非线性 MPC</text><text x="738" y="164" class="sub">兼顾朝向、平衡、约束</text>
    <path d="M901 154H939" stroke="#ffc18c" stroke-width="3" marker-end="url(#ao)"/>
    <rect x="948" y="96" width="221" height="116" rx="13" fill="#2e2a26" stroke="#8b674f" stroke-width="2"/>
    <text x="968" y="134" class="main">模仿学习神经网络</text><text x="968" y="164" class="sub">约 350 万状态—动作样本</text>
    <path d="M1058 212V252H580V348" fill="none" stroke="#ffc18c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/>
    <text x="733" y="242" fill="#ffc18c" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="12">部署训练好的网络权重</text>
  </g>
  <!-- online -->
  <g>
    <rect x="30" y="356" width="181" height="112" rx="13" fill="#14313a" stroke="#468f91" stroke-width="2"/>
    <text x="50" y="394" class="main">用户目标</text><text x="50" y="423" class="sub">朝向 ψ* 与速度 v*</text>
    <path d="M211 412H235V334H558V348" fill="none" stroke="#82e8dd" stroke-width="3" marker-end="url(#ac)"/>
    <rect x="258" y="356" width="183" height="112" rx="13" fill="#14313a" stroke="#468f91" stroke-width="2"/>
    <text x="278" y="394" class="main">状态估计</text><text x="278" y="423" class="sub">姿态、角速度、轮速</text>
    <path d="M441 412H479" stroke="#82e8dd" stroke-width="3" marker-end="url(#ac)"/>
    <rect x="488" y="356" width="183" height="112" rx="13" fill="#14313a" stroke="#468f91" stroke-width="2"/>
    <text x="508" y="394" class="main">机载神经网络</text><text x="508" y="423" class="sub">快速计算控制动作</text>
    <path d="M671 412H709" stroke="#82e8dd" stroke-width="3" marker-end="url(#ac)"/>
    <rect x="718" y="356" width="183" height="112" rx="13" fill="#14313a" stroke="#468f91" stroke-width="2"/>
    <text x="738" y="394" class="main">两台电机</text><text x="738" y="423" class="sub">τD、τR</text>
    <path d="M901 412H939" stroke="#82e8dd" stroke-width="3" marker-end="url(#ac)"/>
    <rect x="948" y="356" width="221" height="112" rx="13" fill="#14313a" stroke="#468f91" stroke-width="2"/>
    <text x="968" y="394" class="main">Wheelbot 本体</text><text x="968" y="423" class="sub">平衡 + 偏航 + 滚动</text>
    <path d="M1057 468V503H350V469" fill="none" stroke="#82e8dd" stroke-width="3" marker-end="url(#ac)"/>
    <text x="620" y="493" class="label">IMU 与编码器反馈</text>
  </g>
</svg>
